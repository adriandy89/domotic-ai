name: domotic-ai

# Rotación de logs para que el json-file no crezca sin límite en el host.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  prisma-migrate:
    logging: *default-logging
    container_name: prisma-migrate
    build:
      context: .
      target: prisma-migrate
    env_file:
      - ./.env.local

  init:
    logging: *default-logging
    container_name: init
    env_file:
      - ./.env.local
    build:
      context: .
      target: production
      args:
        - SERVICE_NAME=init
    restart: always
    depends_on:
      prisma-migrate:
        condition: service_completed_successfully

  api:
    logging: *default-logging
    container_name: api
    env_file:
      - ./.env.local
    build:
      context: .
      target: production
      args:
        - SERVICE_NAME=api
    restart: always
    expose:
      - 3003
    depends_on:
      init:
        condition: service_started

  mqtt-core:
    logging: *default-logging
    container_name: mqtt-core
    env_file:
      - ./.env.local
    build:
      context: .
      target: production
      args:
        - SERVICE_NAME=mqtt-core
    restart: always
    depends_on:
      init:
        condition: service_started

  rules-engine:
    logging: *default-logging
    container_name: rules-engine
    env_file:
      - ./.env.local
    build:
      context: .
      target: production
      args:
        - SERVICE_NAME=rules-engine
    restart: always
    depends_on:
      init:
        condition: service_started

  appliance-monitor:
    logging: *default-logging
    container_name: appliance-monitor
    env_file:
      - ./.env.local
    build:
      context: .
      target: production
      args:
        - SERVICE_NAME=appliance-monitor
    restart: always
    depends_on:
      init:
        condition: service_started

  ai-service:
    logging: *default-logging
    container_name: ai-service
    env_file:
      - ./.env.local
    build:
      context: .
      target: production
      args:
        - SERVICE_NAME=ai-service
    restart: always
    depends_on:
      init:
        condition: service_started

  integrations:
    logging: *default-logging
    container_name: integrations
    env_file:
      - ./.env.local
    build:
      context: .
      target: production
      args:
        - SERVICE_NAME=integrations
    restart: always
    deploy:
      replicas: 1
    depends_on:
      init:
        condition: service_started

networks:
  default:
    external: true
    name: domotic-network
