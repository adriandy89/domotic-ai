# ─────────────────────────────────────────────────────────────────────────────
# Domotic-AI edge broker (mosquitto)
#
# Local MQTT broker that runs in the customer's home. zigbee2mqtt (and the other
# bridges) publish HERE instead of directly to TBMQ. A store-and-forward bridge
# relays everything to/from the central TBMQ broker over the internet — and
# QUEUES messages while the internet is down, delivering them on reconnect.
#
# Placeholders to replace per-home (from the dashboard → Integrations → Edge):
#   HOME_UNIQUE_ID       the home unique_id (also the MQTT username)
#   HOME_MQTT_PASSWORD   the home MQTT password (same one zigbee2mqtt used)
#   your-tbmq-server.com the central TBMQ host
# ─────────────────────────────────────────────────────────────────────────────

# ── Local listener ───────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
log_dest stdout
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwords

# ── Bridge to central TBMQ (store-and-forward) ───────────────────────────────
connection central-bridge
address your-tbmq-server.com:1883
remote_username HOME_UNIQUE_ID
remote_password HOME_MQTT_PASSWORD
# Distinct client id for the bridge session (username is shared across bridges).
remote_clientid HOME_UNIQUE_ID-bridge

# Directional topic map — this is what stops command/telemetry echo loops
# WITHOUT relying on MQTT v5's "no local" flag.
#
# The bridge SUBSCRIBES on TBMQ only to what central pushes DOWN (`in`), and
# PUBLISHES UP (`out`) only telemetry — never `/set`. Because the in-set and the
# out-set do not overlap, TBMQ has nothing of ours to reflect back: a command the
# edge engine runs locally is never shipped up, so it can't bounce back down and
# fire a second time (the exact hazard `both #` + no-local used to guard against).
#
# Why not v5 no-local: TBMQ 2.2.0 does NOT honour a bridge SUBSCRIBE that carries
# the no-local option — with `bridge_protocol_version mqttv50` the downlink
# silently stops delivering (commands + the retained rules bundle never arrive)
# while the uplink PUBLISH keeps working. So we stay on the 3.1.1 default.
#
# DOWN (in): commands + the retained edge-rules bundle.
topic home/id/HOME_UNIQUE_ID/+/+/set in 1
topic home/id/HOME_UNIQUE_ID/edge/rules in 1
#
# UP (out): all telemetry EXCEPT `/set` (state is depth-2, availability/bridge
# are their own subtrees, so `/set` is never matched here).
# NOTE: mosquitto only treats a line STARTING with `#` as a comment — never put a
# trailing comment on a `topic` line (it is parsed as local/remote prefix).
# device state:
topic home/id/HOME_UNIQUE_ID/+/+ out 1
# zigbee2mqtt bridge/devices + status:
topic home/id/HOME_UNIQUE_ID/+/bridge/# out 1
# per-device availability:
topic home/id/HOME_UNIQUE_ID/+/+/availability out 1
# HA-Discovery configs (zwave/wifi/ble):
topic home/id/HOME_UNIQUE_ID/discovery/# out 1

# Persist the bridge session so TBMQ keeps queued downlink messages across brief
# reconnects. try_private=false because TBMQ is not a mosquitto peer. mosquitto
# re-sends its SUBSCRIBE on every (re)connect, so the downlink survives restarts.
try_private false
start_type automatic
restart_timeout 5 30
cleansession false
notifications false

# Queue while offline: bound the backlog so a long outage can't exhaust disk.
max_queued_messages 100000
max_inflight_messages 0
local_cleansession false
