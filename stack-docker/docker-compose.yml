name: stack-domotic

# Rotación de logs para que el json-file no crezca sin límite en el host.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  redis:
    logging: *default-logging
    container_name: redis
    image: redis:8.4.0-alpine
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass Redis_Pass_6379
    volumes:
      - redis-data:/data

  timescaledb:
    logging: *default-logging
    container_name: timescaledb
    # OJO (PG18): estas imágenes guardan los datos en /var/lib/postgresql/18/docker
    # y el volumen debería montarse en /var/lib/postgresql (ver
    # docker-compose.dev.yml). NO cambiar el montaje ni la etiqueta en un servidor
    # sin comprobar antes dónde están los datos reales:
    #   docker inspect timescaledb --format '{{json .Mounts}}'
    # Tampoco fijar una versión inferior a la de la extensión ya instalada
    # (SELECT extversion FROM pg_extension WHERE extname='timescaledb').
    image: timescale/timescaledb:latest-pg18
    restart: always
    environment:
      POSTGRES_DB: domoticdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - timescaledb:/var/lib/postgresql/data
    command: ['-c', 'max_connections=200']

  nats:
    logging: *default-logging
    container_name: nats
    # Fijado (antes :latest). 2.15.2 es la versión probada con los clientes
    # NATS v2 (Nest 11) y v3 (@nats-io/transport-node, Nest 12).
    image: nats:2.15.2
    restart: always
    ports:
      - '4222:4222'
    volumes:
      - ./nats.conf:/etc/nats/nats.conf
    command: ['-c', '/etc/nats/nats.conf']

volumes:
  timescaledb:
  redis-data:

networks:
  default:
    name: domotic-network
